name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    services:
      # The database tests run on PGlite by default. With this they also run on a real server.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
      TEST_IPFS_API_URL: http://127.0.0.1:5001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile

      # The file store tests also run against an IPFS node. A service container cannot be
      # given the `daemon --offline` arguments, so it is started here.
      - name: Start an IPFS node
        run: |
          docker run -d --name kubo -p 127.0.0.1:5001:5001 ipfs/kubo:latest daemon --offline
          timeout 60 sh -c 'until curl -sf -X POST http://127.0.0.1:5001/api/v0/version; do sleep 1; done'

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:ts6
      - name: Check contract formatting and lints
        working-directory: contracts
        run: |
          forge fmt --check
          forge lint
      - run: pnpm test
      - name: Test the contracts under Monad's rules
        working-directory: contracts
        run: FOUNDRY_PROFILE=monad forge test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      # The tests drive the Chrome that the runner image already has.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
