# The app with a Postgres server for its data and an IPFS node for its files.
#   docker compose up --build
# Settings come from .env: see .env.example. NEXT_PUBLIC_ values are read at build time.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_NETWORKS: ${NEXT_PUBLIC_NETWORKS:-local}
        NEXT_PUBLIC_ENS: ${NEXT_PUBLIC_ENS:-off}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      IPFS_API_URL: http://ipfs:5001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      timeout: 5s
      retries: 10

  # Its RPC port stays inside this network. Only the web service talks to it.
  ipfs:
    image: ipfs/kubo:latest
    volumes:
      - ipfs:/data/ipfs

volumes:
  postgres:
  ipfs:
