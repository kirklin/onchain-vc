<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <style>
    .back { fill: hsl(0 0% 8%); }
    .seat { fill: hsl(0 0% 100%); }
    @media (prefers-color-scheme: dark) {
      .back { fill: hsl(0 0% 100%); }
      .seat { fill: hsl(0 0% 8%); }
    }
  </style>
  <rect class="back" width="28" height="28" rx="8" />
  <rect class="seat" x="10" y="10" width="8" height="8" rx="2" />
  <circle class="seat" cx="14" cy="6.5" r="1.75" />
  <circle class="seat" cx="14" cy="21.5" r="1.75" />
  <circle class="seat" cx="6.5" cy="14" r="1.75" />
  <circle class="seat" cx="21.5" cy="14" r="1.75" />
</svg>
